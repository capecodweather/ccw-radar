name: Generate latest 12 KBOX reflectivity images (HQ + outlines + dBZ scale)

on:
  workflow_dispatch: {}

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib arm_pyart requests pillow

      - name: Fetch latest 12 KBOX scans and render images
        run: |
          python << 'EOF'
          import requests
          import xml.etree.ElementTree as ET
          import pyart
          import numpy as np
          import matplotlib.pyplot as plt
          from pathlib import Path
          from datetime import datetime, timedelta
          from PIL import Image

          # ---------------- CONFIG ---------------- #
          RADAR = "KBOX"
          BASE_URL = "https://unidata-nexrad-level2.s3.amazonaws.com"
          MAX_FRAMES = 12

          IMAGE_PX = 1600          # radar panel size
          COLORBAR_PX = 120        # reserved space
          DPI = 100
          MAX_RANGE_KM = 230.0

          DBZ_MIN = 0
          DBZ_MAX = 75

          OUT_DIR = Path("output")
          OUT_DIR.mkdir(exist_ok=True)

          OVERLAY_PATH = Path("overlays/sne_states_with_dbz.png")
          # ---------------------------------------- #

          overlay = Image.open(OVERLAY_PATH).convert("RGBA")
          overlay = overlay.resize((IMAGE_PX, IMAGE_PX), Image.LANCZOS)

          ns = {"s3": "http://s3.amazonaws.com/doc/2006-03-01/"}

          def list_keys(prefix):
              url = f"{BASE_URL}/?prefix={prefix}"
              r = requests.get(url, timeout=30)
              r.raise_for_status()
              root = ET.fromstring(r.text)
              return [
                  e.text for e in root.findall("s3:Contents/s3:Key", ns)
              ]

          today = datetime.utcnow().date()
          yesterday = today - timedelta(days=1)

          prefixes = [
              f"{today:%Y/%m/%d}/{RADAR}/",
              f"{yesterday:%Y/%m/%d}/{RADAR}/",
          ]

          keys = []
          for p in prefixes:
              try:
                  for k in list_keys(p):
                      if "_MDM" in k:
                          continue
                      if k.endswith("_V06") or k.endswith("_V07"):
                          keys.append(k)
              except Exception as e:
                  print(f"Warning listing {p}: {e}")

          if len(keys) < MAX_FRAMES:
              raise RuntimeError(f"Only found {len(keys)} radar scans")

          latest = sorted(keys)[-MAX_FRAMES:]

          for i, key in enumerate(latest):
              url = f"{BASE_URL}/{key}"
              local_file = OUT_DIR / f"scan_{i:02d}"

              with requests.get(url, stream=True, timeout=60) as r:
                  r.raise_for_status()
                  with open(local_file, "wb") as f:
                      for chunk in r.iter_content(8192):
                          f.write(chunk)

              radar = pyart.io.read_nexrad_archive(local_file)

              slc = radar.get_slice(0)
              refl = radar.fields["reflectivity"]["data"][slc]
              az = np.deg2rad(radar.azimuth["data"][slc])
              r_km = radar.range["data"] / 1000.0

              x = np.outer(np.sin(az), r_km)
              y = np.outer(np.cos(az), r_km)

              # -------- FIGURE LAYOUT --------
              total_width = IMAGE_PX + COLORBAR_PX
              fig = plt.figure(
                  figsize=(total_width / DPI, IMAGE_PX / DPI),
                  dpi=DPI
              )

              ax = fig.add_axes([
                  0.0,
                  0.0,
                  IMAGE_PX / total_width,
                  1.0
              ])

              cax = fig.add_axes([
                  IMAGE_PX / total_width + 0.02,
                  0.1,
                  0.04,
                  0.8
              ])
              # --------------------------------

              mesh = ax.pcolormesh(
                  x, y, refl,
                  cmap="NWSRef",
                  vmin=DBZ_MIN,
                  vmax=DBZ_MAX,
                  shading="auto"
              )

              ax.imshow(
                  overlay,
                  extent=[
                      -MAX_RANGE_KM, MAX_RANGE_KM,
                      -MAX_RANGE_KM, MAX_RANGE_KM
                  ],
                  interpolation="nearest"
              )

              ax.set_xlim(-MAX_RANGE_KM, MAX_RANGE_KM)
              ax.set_ylim(-MAX_RANGE_KM, MAX_RANGE_KM)
              ax.set_aspect("equal")
              ax.axis("off")

              cb = fig.colorbar(mesh, cax=cax)
              cb.set_label("Reflectivity (dBZ)")
              cb.ax.tick_params(labelsize=11)

              out_png = OUT_DIR / f"radar_{i:02d}.png"
              fig.savefig(out_png, dpi=DPI)
              plt.close(fig)

          print("Frames complete.")
          EOF

      - name: Upload images as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kbox_latest_12
          path: output/radar_*.png
