name: KBOX Latest 12 (Reflectivity)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kbox-latest-12
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system deps (Cartopy/PROJ/GEOS)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgeos-dev proj-bin proj-data gdal-bin
          python -m pip install --upgrade pip

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install arm_pyart cartopy netCDF4 matplotlib numpy requests pillow

      - name: Generate 12 frames
        run: |
          python scripts/kbox_latest_12.py

      - name: Commit latest frames (amend single auto-commit)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A output/radar_*.png

          if git diff --cached --quiet; then
            echo "No changes; nothing to commit."
            exit 0
          fi

          LAST_SUBJECT="$(git log -1 --pretty=%s || echo '')"
          if echo "$LAST_SUBJECT" | grep -q "^Auto-update radar images"; then
            git commit --amend --no-edit
          else
            git commit -m "Auto-update radar images"
          fi

          git push origin HEAD:main --force
