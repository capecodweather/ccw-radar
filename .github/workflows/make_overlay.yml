name: Generate SNE overlay with state outlines + dBZ colorbar

on:
  workflow_dispatch: {}

jobs:
  overlay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib cartopy shapely pyproj

      - name: Generate overlay with embedded colorbar
        run: |
          python << 'EOF'
          import matplotlib.pyplot as plt
          import cartopy.feature as cfeature
          import cartopy.crs as ccrs
          import matplotlib as mpl
          from matplotlib.patches import Rectangle

          # ---------------- CONFIG ---------------- #
          RADAR_LAT = 41.955
          RADAR_LON = -71.137
          MAX_RANGE_KM = 230.0

          IMAGE_PX = 1600
          DPI = 100

          DBZ_MIN = 0
          DBZ_MAX = 75
          # ---------------------------------------- #

          proj = ccrs.AzimuthalEquidistant(
              central_latitude=RADAR_LAT,
              central_longitude=RADAR_LON
          )

          fig = plt.figure(figsize=(IMAGE_PX / DPI, IMAGE_PX / DPI), dpi=DPI)
          ax = fig.add_axes([0, 0, 1, 1], projection=proj)

          extent_m = MAX_RANGE_KM * 1000
          ax.set_extent(
              [-extent_m, extent_m, -extent_m, extent_m],
              crs=proj
          )

          # Draw state outlines
          ax.add_feature(
              cfeature.STATES.with_scale("10m"),
              linewidth=1.0,
              edgecolor="black",
              facecolor="none",
              zorder=2
          )

          ax.axis("off")
          fig.patch.set_alpha(0)
          ax.patch.set_alpha(0)

          # ---- COLORBAR PANEL (axes fraction) ----
          panel_left = 0.86
          panel_width = 0.12
          panel_bottom = 0.08
          panel_height = 0.84

          ax.add_patch(
              Rectangle(
                  (panel_left, panel_bottom),
                  panel_width,
                  panel_height,
                  transform=ax.transAxes,
                  facecolor=(1, 1, 1, 0.90),
                  edgecolor=(0, 0, 0, 0.4),
                  linewidth=1.0,
                  zorder=3
              )
          )

          # ---- COLORBAR ITSELF ----
          cax = fig.add_axes([
              panel_left + 0.04,
              panel_bottom + 0.05,
              0.035,
              panel_height - 0.10
          ])

          cmap = mpl.cm.get_cmap("NWSRef")
          norm = mpl.colors.Normalize(vmin=DBZ_MIN, vmax=DBZ_MAX)

          cb = mpl.colorbar.ColorbarBase(
              cax,
              cmap=cmap,
              norm=norm,
              orientation="vertical"
          )

          cb.set_label("Reflectivity (dBZ)", fontsize=12)
          cb.ax.tick_params(labelsize=11)

          plt.savefig(
              "sne_states_with_dbz.png",
              dpi=DPI,
              transparent=True,
              bbox_inches="tight",
              pad_inches=0
          )

          plt.close()
          print("Saved sne_states_with_dbz.png")
          EOF

      - name: Upload overlay
        uses: actions/upload-artifact@v4
        with:
          name: sne-overlay-with-dbz
          path: sne_states_with_dbz.png
