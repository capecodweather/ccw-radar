name: Generate latest 12 KBOX reflectivity images

on:
  workflow_dispatch: {}

jobs:
  kbox:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib arm_pyart requests

      - name: Fetch latest 12 KBOX files and plot reflectivity
        run: |
          python << 'EOF'
          import requests
          import xml.etree.ElementTree as ET
          import pyart
          import numpy as np
          import matplotlib.pyplot as plt
          from pathlib import Path
          from datetime import datetime, timedelta

          RADAR = "KBOX"
          BASE_URL = "https://unidata-nexrad-level2.s3.amazonaws.com"
          MAX_FILES = 12

          OUT_DIR = Path("output")
          OUT_DIR.mkdir(exist_ok=True)

          ns = {"s3": "http://s3.amazonaws.com/doc/2006-03-01/"}

          def list_keys(prefix):
              url = f"{BASE_URL}/?prefix={prefix}"
              r = requests.get(url, timeout=30)
              r.raise_for_status()
              root = ET.fromstring(r.text)
              return [
                  e.text for e in root.findall("s3:Contents/s3:Key", ns)
              ]

          today = datetime.utcnow().date()
          yesterday = today - timedelta(days=1)

          prefixes = [
              f"{today:%Y/%m/%d}/{RADAR}/",
              f"{yesterday:%Y/%m/%d}/{RADAR}/",
          ]

          keys = []
          for p in prefixes:
              try:
                  keys.extend(list_keys(p))
              except Exception as e:
                  print(f"Warning: could not list {p}: {e}")

          if len(keys) < MAX_FILES:
              raise RuntimeError(f"Only found {len(keys)} radar files")

          latest_keys = sorted(keys)[-MAX_FILES:]

          print("Using files:")
          for k in latest_keys:
              print(" ", k)

          for i, key in enumerate(latest_keys):
              url = f"{BASE_URL}/{key}"
              local_file = OUT_DIR / f"radar_{i:02d}"

              with requests.get(url, stream=True, timeout=60) as r:
                  r.raise_for_status()
                  with open(local_file, "wb") as f:
                      for chunk in r.iter_content(8192):
                          f.write(chunk)

              radar = pyart.io.read_nexrad_archive(local_file)

              sweep = 0
              slc = radar.get_slice(sweep)

              refl = radar.fields["reflectivity"]["data"][slc]
              az = np.deg2rad(radar.azimuth["data"][slc])
              r_km = radar.range["data"] / 1000.0

              x = np.outer(np.sin(az), r_km)
              y = np.outer(np.cos(az), r_km)

              plt.figure(figsize=(6, 6))
              plt.pcolormesh(x, y, refl, cmap="NWSRef", shading="auto")
              plt.axis("equal")
              plt.axis("off")
              plt.title(f"KBOX Reflectivity ({key[-15:]})")

              out_png = OUT_DIR / f"kbox_{i:02d}.png"
              plt.savefig(out_png, dpi=150, bbox_inches="tight")
              plt.close()

              print(f"Saved {out_png}")

          print("Done.")
          EOF

      - name: Upload images as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kbox-latest-12
          path: output/*.png
