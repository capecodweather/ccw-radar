name: Test radar plot (KBOX fixed file)

on:
  workflow_dispatch: {}

jobs:
  radar-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib arm_pyart

      - name: Download KBOX Level II file (fixed URL)
        run: |
          curl -L -o kbox \
            https://unidata-nexrad-level2.s3.amazonaws.com/2025/12/27/KBOX/KBOX20251227_153729_V06

          echo "Downloaded bytes:"
          wc -c kbox

          echo "First 16 bytes (should NOT look like HTML/XML):"
          head -c 16 kbox | xxd -g 1

      - name: Plot reflectivity (lowest tilt)
        run: |
          python << 'EOF'
          import pyart
          import numpy as np
          import matplotlib.pyplot as plt

          # Read the Level II file
          radar = pyart.io.read_nexrad_archive("kbox")

          # Lowest sweep
          sweep = 0
          sweep_slice = radar.get_slice(sweep)

          refl = radar.fields["reflectivity"]["data"][sweep_slice]
          az = np.deg2rad(radar.azimuth["data"][sweep_slice])
          r = radar.range["data"] / 1000.0  # km

          # Fast Cartesian conversion
          x = np.outer(np.sin(az), r)
          y = np.outer(np.cos(az), r)

          plt.figure(figsize=(6, 6))
          plt.pcolormesh(x, y, refl, cmap="pyart_NWSRef", shading="auto")
          plt.axis("equal")
          plt.axis("off")
          plt.title("KBOX Reflectivity (KBOX20251227_153729_V06)")

          plt.savefig("kbox_test.png", dpi=150, bbox_inches="tight")
          plt.close()

          print("Saved kbox_test.png")
          EOF

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kbox-test-image
          path: kbox_test.png
