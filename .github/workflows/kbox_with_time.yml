name: Generate & Publish KBOX Radar (GitHub Pages)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kbox-radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib arm_pyart requests pillow

      - name: Generate latest KBOX radar frames
        run: python scripts/generate_kbox_radar.py

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish radar images
        run: |
          mkdir -p gh-pages/radar
          rsync -a --delete render/ gh-pages/radar/

      - name: Commit and push if changed
        working-directory: gh-pages
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add radar/
            git commit -m "Update KBOX radar images ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No changes to publish."
          fi
